name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Saturday 05:00 UTC: 06:00 in Paris in winter, 07:00 in summer (Gitea runs cron in UTC).
    - cron: "0 5 * * 6"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get shared actions
        uses: actions/checkout@v7
        with:
          repository: labeex/cicdeex
          ref: 1.1.0
          token: ${{ secrets.CICDEEX_TOKEN }}
          path: .cicdeex
          persist-credentials: false

      - name: Scan for secrets
        uses: ./.cicdeex/secret-scan

      - name: Lint Dockerfile with hadolint
        uses: ./.cicdeex/hadolint

      - name: Build Docker image
        run: |
          docker build -t adguard-cidre:ci . 2>&1 | tee build.log
          if grep -q "Building wheel for" build.log; then
            echo "::warning::A dependency was built from source — check Python/Alpine compatibility"
          fi

      - name: Smoke test (syntax check)
        run: |
          docker run --rm --entrypoint python adguard-cidre:ci -c "
          import ast
          with open('blocklist_scheduler.py') as f:
              source = f.read()
          try:
              ast.parse(source)
              print('OK: syntax is valid')
          except SyntaxError as e:
              print(f'::error::Syntax error: {e}')
              exit(1)
          "

      - name: Run unit tests
        run: |
          docker build --target test -t adguard-cidre:test .
          docker run --rm adguard-cidre:test pytest -v --cov=. --cov-report=term-missing --cov-fail-under=75

      - name: Lint with ruff
        run: docker build --target lint -t adguard-cidre:lint .

      - name: Check deprecation warnings
        run: |
          docker run --rm --entrypoint python adguard-cidre:ci -W error::DeprecationWarning -c "import blocklist_scheduler" 2>&1 | tee deprecation.log || true
          if grep -qi "deprecat" deprecation.log; then
            echo "::warning::Deprecation warning detected, check logs"
          fi

      - name: Scan with Trivy (critical - blocking)
        id: trivy_critical
        continue-on-error: true
        uses: ./.cicdeex/trivy
        with:
          image: adguard-cidre:ci

      - name: Handle CRITICAL findings
        if: steps.trivy_critical.outcome == 'failure'
        uses: ./.cicdeex/remediate
        with:
          push-token: ${{ secrets.CI_PUSH_TOKEN }}

      - name: Scan with Trivy (high - informative)
        uses: ./.cicdeex/trivy
        with:
          image: adguard-cidre:ci
          severity: HIGH
          exit-code: "0"

      - name: Publish tagged image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.cicdeex/publish
        with:
          image: adguard-cidre:ci
          paths: '^(Dockerfile|blocklist_scheduler\.py|VERSION)$'
          push-token: ${{ secrets.CI_PUSH_TOKEN }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          github-mirror: "true"
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Notify failures
        if: always()
        uses: ./.cicdeex/notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
